<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | Swapswap3.0</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      #unity-canvas {
        width: 100vw !important;
        height: 100vh !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        object-fit: contain;
      }
    </style>
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0">
    <canvas
      id="unity-canvas"
      width="1080"
      height="1920"
      tabindex="-1"
      style="width: 1080px; height: 1920px; background: #231f20"
    ></canvas>
    <script src="Build/display.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      const SOCKET_SERVER_URL = window.location.origin;
      const socket = io(SOCKET_SERVER_URL, {
        query: { token: "UNITY_CLIENT" },
        transports: ["websocket", "polling"],
      });

      socket.on("connect", () => {
        console.log("Connected to Socket Server! ID:", socket.id);
        socket.emit("register_unity");
      });

      socket.on("disconnect", () => {
        console.log("Disconnected from Socket Server!");
      });

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/display.data",
        frameworkUrl: "Build/display.framework.js",
        codeUrl: "Build/display.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Swapswap3.0",
        productVersion: "1.0",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      })
        .then((unityInstance) => {
          console.log("Unity WebGL Instance Ready!");

          // 3. รับ Event จาก Socket แล้วแปลง Payload ส่งให้ Unity
          socket.on("display_on_unity", (response) => {
            console.log("Received display_on_unity in JS:", response);

            let data = response;
            if (Array.isArray(response) && response.length > 0) {
              data = response[0];
            }

            if (!data || !data.imageURL) {
              console.error("Invalid payload structure received:", response);
              return;
            }

            // จัดการ URL ของรูปภาพ
            let fullURL = data.imageURL;
            if (
              !fullURL.startsWith("http://") &&
              !fullURL.startsWith("https://")
            ) {
              fullURL =
                SOCKET_SERVER_URL +
                (fullURL.startsWith("/") ? "" : "/") +
                fullURL;
            }

            // เพิ่ม Cache Buster ป้องกัน Browser ค้างแคชรูปเดิม
            data.imageURL = fullURL + "?t=" + Date.now();

            // ส่ง JSON String ทั้ง Object เข้าไปยังฟังก์ชัน OnPayloadReceived ใน Unity
            const jsonString = JSON.stringify(data);
            unityInstance.SendMessage(
              "ScriptManager",
              "OnPayloadReceived",
              jsonString,
            );
          });
        })
        .catch((message) => {
          alert(message);
        });
    </script>
  </body>
</html>
